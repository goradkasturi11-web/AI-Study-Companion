<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | AI Study Companion</title><link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="navbar"><a class="logo" href="index.html">🤖 AI Study Companion</a><nav><a href="index.html">Home</a><a href="login.html">Login</a></nav></header>
<main class="form-page">
  <form class="form-card" id="registerForm">
    <span class="badge">JOIN US</span><h1>Create Account</h1><p>Start your smart learning journey.</p>
    <label>
  Full Name
  <input type="text" name="name" required placeholder="Your name">
</label>

<label>
  Email
  <input type="email" name="email" required placeholder="you@example.com">
</label>

<label>
  Password
  <input type="password" name="password" id="password" required minlength="6" placeholder="Minimum 6 characters">
</label>

<label>
  Confirm Password
  <input type="password" name="confirmPassword" id="confirmPassword" required placeholder="Repeat password">
</label>
    <button class="btn" type="submit">Register</button>
    <p class="center">Already have an account? <a href="login.html">Login</a></p>
  </form>
</main>
<footer>© 2026 AI Study Companion</footer>
<script src="js/script.js"></script>
</body>
</html>
